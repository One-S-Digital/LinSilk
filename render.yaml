# LinSilk on Render.
#
# Every secret here comes from Render, never from the repository: values
# marked `sync: false` are typed into the dashboard once, `generateValue`
# ones are minted by Render and never seen, and the database and key value
# store hand out their own connection strings. The apps read all of it from
# the process environment, so the same build runs locally against
# apps/*/.env and in production against Render's environment groups.
#
# After the first deploy, set the three CORS values and STOREFRONT_URL to the
# hostnames Render assigns, then run the seed once (see docs/BACKEND-RENDER.md).

services:
  - type: web
    name: linsilk-medusa
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter medusa build
    startCommand: pnpm --filter medusa start
    healthCheckPath: /health
    # Migrations run before the new version takes traffic, and never on a
    # rollback the way a build step would.
    preDeployCommand: pnpm --filter medusa exec medusa db:migrate
    envVars:
      - key: NODE_ENV
        value: production
      - key: MEDUSA_WORKER_MODE
        value: server
      - key: DATABASE_URL
        fromDatabase:
          name: linsilk-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: linsilk-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - fromGroup: linsilk-secrets
      - fromGroup: linsilk-urls

  # A long subscriber — an atelier notification, a file transcode — must not
  # block a checkout, so events and scheduled jobs run in their own process.
  - type: worker
    name: linsilk-worker
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter medusa build
    startCommand: pnpm --filter medusa start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MEDUSA_WORKER_MODE
        value: worker
      - key: DATABASE_URL
        fromDatabase:
          name: linsilk-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: linsilk-redis
          type: keyvalue
          property: connectionString
      # The same secrets as the server: the two processes share an event bus,
      # a workflow engine and a lock, and must agree about all of it.
      - key: JWT_SECRET
        fromService:
          name: linsilk-medusa
          type: web
          envVarKey: JWT_SECRET
      - key: COOKIE_SECRET
        fromService:
          name: linsilk-medusa
          type: web
          envVarKey: COOKIE_SECRET
      - fromGroup: linsilk-secrets
      - fromGroup: linsilk-urls

  - type: web
    name: linsilk-storefront
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter storefront build
    startCommand: pnpm --filter storefront start
    envVars:
      - key: NODE_ENV
        value: production
      # Baked into the browser bundle at build time, so a change needs a
      # redeploy. Public by design: the key names a sales channel.
      - key: NEXT_PUBLIC_MEDUSA_BACKEND_URL
        sync: false
      - key: NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: PAYLOAD_SECRET
        generateValue: true
      # Render provisions one database per instance (linsilk_medusa, below), so
      # linsilk_payload is created manually and typed in here once
      # (docs/BACKEND-RENDER.md §8.3).
      - key: DATABASE_URI
        sync: false

  - type: keyvalue
    name: linsilk-redis
    plan: starter
    region: frankfurt
    ipAllowList: []          # reachable only from inside the private network

databases:
  - name: linsilk-postgres
    plan: basic-256mb
    region: frankfurt
    databaseName: linsilk_medusa
    postgresMajorVersion: "16"

envVarGroups:
  # Typed into Render once, shared by the server and the worker.
  - name: linsilk-secrets
    envVars:
      - key: STRIPE_API_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FILE_URL
        sync: false
      # The hosts the catalogue ingestion route may fetch photography from,
      # comma separated. Until it is set, the route fetches from nowhere and
      # says so (docs/CATALOGUE-INGESTION.md).
      - key: CATALOGUE_IMAGE_HOSTS
        sync: false

  # Set once the hostnames exist.
  - name: linsilk-urls
    envVars:
      - key: STORE_CORS
        sync: false
      - key: ADMIN_CORS
        sync: false
      - key: AUTH_CORS
        sync: false
      - key: STOREFRONT_URL
        sync: false
      - key: ATELIER_EMAIL
        sync: false
