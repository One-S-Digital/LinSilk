services:
  postgres:
    image: postgres:16-alpine
    container_name: ayla-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ayla
      POSTGRES_PASSWORD: ayla
      POSTGRES_DB: ayla_medusa
    ports:
      - '5432:5432'
    volumes:
      - ayla-pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ayla -d ayla_medusa']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ayla-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - ayla-redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ayla-pgdata:
  ayla-redisdata:
