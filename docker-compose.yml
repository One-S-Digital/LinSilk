services:
  postgres:
    image: postgres:16-alpine
    container_name: linsilk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: linsilk
      POSTGRES_PASSWORD: linsilk
      POSTGRES_DB: linsilk_medusa
    ports:
      - '5432:5432'
    volumes:
      - linsilk-pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U linsilk -d linsilk_medusa']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: linsilk-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - linsilk-redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  linsilk-pgdata:
  linsilk-redisdata:
